  # Landing Page
  landing:
    tagline: "Gestión de propiedades, <br>sin el caos"
    subtitle: Rastrear alquileres, monitorear arrendamientos activos y nunca pierdas un pago vencido. Todas tus propiedades en un panel hermoso.
    start_managing: Comienza a Gestionar Gratis
    features_header: Todo lo que necesitas para gestionar como un profesional
    features_subtitle: Construido para propietarios independientes que quieren simplicidad sin sacrificar poder.
    feature_tracking_title: Seguimiento de Propiedades sin Esfuerzo
    feature_tracking_desc: Mantén todos tus bienes raíces organizados en un panel central. Ve el estado del portafolio, tasas de ocupación y detalles clave de un vistazo.
    feature_tracking_1: Descripción general de múltiples propiedades
    feature_tracking_2: Notas personalizadas de propiedades
    feature_tracking_3: Estado de ocupación
    feature_agreements_title: Contratos de Alquiler Inteligentes
    feature_agreements_desc: Rastrea renovaciones de arrendamientos activos, vencidos y próximos sin problemas. Recibe notificaciones antes de que venza el arrendamiento para que nunca pierdas una oportunidad de renovación.
    feature_agreements_1: Vista de cronología de arrendamiento
    feature_agreements_2: Alertas de renovación
    feature_agreements_3: Duplicación rápida de arrendamiento
    feature_payments_title: Alertas de Pago Vencido
    feature_payments_desc: Detecta instantáneamente alquileres perdidos con insignias de estado visuales automatizadas. Nunca dejes que los pagos atrasados afecten tu flujo de efectivo nuevamente.
    feature_payments_1: Insignias de estado en tiempo real
    feature_payments_2: Seguimiento de pagos
    feature_payments_3: Historial de pagos claro
    cta_title: Comienza a gestionar tus propiedades hoy
    cta_subtitle: Únete a propietarios en todo el país que han abandonado hojas de cálculo por una forma más inteligente de gestionar.
